name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests cover timing, mixing, translation and subtitles without the
      # speech models, so CI stays light. The models run in the end-to-end dub.
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: echo-dub --version
